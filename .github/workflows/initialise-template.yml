name: Initialise Repository from Template

on:
  push:
    branches:
      - main

jobs:
  initialise:
    if: github.repository != 'nmclaughlin98/aws-cdk-template-typescript'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require initialization token
        env:
          INITIALIZATION_TOKEN: ${{ secrets.TEMPLATE_INIT_TOKEN }}
        run: |
          if [[ -z "$INITIALIZATION_TOKEN" ]]; then
            echo "::error::Add a TEMPLATE_INIT_TOKEN secret with Contents, Workflows, and Pull requests read/write access, then rerun this workflow."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.TEMPLATE_INIT_TOKEN }}

      - name: Create Initialization Branch
        run: git switch --create template-initialization

      - name: Replace Project Placeholders
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          find template -type f -exec sed -i \
            -e "s|{--TEMPLATE_REPO_NAME--}|${REPOSITORY_NAME}|g" \
            -e "s|TEMPLATE_OWNER|${REPOSITORY_OWNER}|g" {} +

      - name: Promote Project Files
        run: |
          rm README.md
          find template -mindepth 1 -maxdepth 1 ! -name .github -exec mv -t . -- {} +
          cp -a template/.github/. .github/
          rm -rf template/.github
          rmdir template
          git rm .github/workflows/initialise-template.yml

      - name: Commit and Push Initialization Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialise repository from template"
          git push --force --set-upstream origin HEAD:template-initialization

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_INIT_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          existing_pr="$(gh pr list \
            --state open \
            --base main \
            --head "${REPOSITORY_OWNER}:template-initialization" \
            --json url \
            --jq '.[0].url // ""')"

          if [[ -n "$existing_pr" ]]; then
            echo "::notice::Initialization pull request already exists: $existing_pr"
          else
            gh pr create \
              --base main \
              --head template-initialization \
              --title "chore: initialise repository from template" \
              --body "Promotes the staged CDK project to the repository root, replaces template placeholders, and removes the initializer."
          fi
