name: Initialise Repository from Template

on:
  push:
    branches:
      - main

jobs:
  initialise:
    if: github.repository != 'nmclaughlin98/aws-cdk-template-typescript'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Replace Project Placeholders
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          find template -type f -exec sed -i \
            -e "s|TEMPLATE_REPO_NAME|${REPOSITORY_NAME}|g" \
            -e "s|TEMPLATE_OWNER|${REPOSITORY_OWNER}|g" {} +

      - name: Promote Project Files
        run: |
          rm README.md
          find template -mindepth 1 -maxdepth 1 ! -name .github -exec mv -t . -- {} +
          cp -a template/.github/. .github/
          rm -rf template/.github
          rmdir template

      - name: Commit and Push Project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialise repository from template"
          git push origin HEAD:main

      - name: Self-Destruct Workflow
        run: |
          git rm .github/workflows/initialise-template.yml
          git commit -m "chore: remove template initialisation workflow"
          git push origin HEAD:main
